name: 21Vianet
description: >-
  21Vianet (VNET Group, Inc.) is the largest carrier-neutral internet and data
  center services provider in China, operating more than 50 data centers across
  over 20 cities with tens of thousands of cabinets and multi-terabit network
  port capacity. The company delivers hosting, managed hosting, interconnectivity,
  cloud, and hybrid IT infrastructure services to enterprise customers, and is the
  exclusive operator of Microsoft Azure, Microsoft 365, Dynamics 365, and Power
  Platform in mainland China through its Blue Cloud subsidiary. 21Vianet trades on
  Nasdaq under the ticker VNET. This profile was added to the API Evangelist network
  as a portfolio lead; 21Vianet does not publish a public first-party developer API
  program, so most API artifacts are legitimately not applicable.
